<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>Fractured Worlds RPG</title>
    <meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=no, minimum-scale=1, width=device-width, height=device-height">
    <!-- Pixel font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
    <!-- /Pixel font -->
    <script>
        window.onload = function() {
            const gridSize = 32;
            const canvas = document.getElementById("rpg");
            canvas.style.height = Math.floor(window.innerHeight / gridSize) * gridSize + "px";
            canvas.style.width = Math.floor(window.innerWidth / gridSize) * gridSize + "px";
            
        };
        window.onresize = function() {
            const gridSize = 32;
            const canvas = document.getElementById("rpg");
            canvas.style.height = Math.floor(window.innerHeight / gridSize) * gridSize + "px";
            canvas.style.width = Math.floor(window.innerWidth / gridSize) * gridSize + "px";
            
        };
    </script>
</head>

<body>
    <!-- Title screen needs to be re-enabled in node_modules\@rpgjs\title-screen\src\server\rpg\index.ts by uncommenting gui.open() -->
    <div id="rpg"></div>
    
    <style>
        body,
        html {
            height: 100%;
            overflow: hidden;
        }

        body {
            margin: 0;
            background-color: black; 
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #rpg {
            position: relative;
            
        }

        /* full screen */
        @media (min-width: 800px) {
            #rpg {
                width: 100%;
                height: 100%;
            }
        }

        /* @media (min-width: 768px) {
            #rpg {
                width: 768px;
                height: 640px;
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
            }
        } */

        @media (max-width: 800px) {
            #rpg {
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
            }
        }

        .d-pad {
            width: 100% !important;
        }

        .actions {
            width: 5% !important;
            touch-action: none;
        }

        .action {
            pointer-events: auto !important;
        }
    </style>
</body>

</html>
